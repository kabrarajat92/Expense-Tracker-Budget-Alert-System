spring.application.name=api-gateway

# Server Configuration
server.port=${SERVER_PORT:8081}

# Gateway Route 1 - User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8090}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**

# Gateway Route 2 - Expense Service
spring.cloud.gateway.routes[1].id=expense-service
spring.cloud.gateway.routes[1].uri=${EXPENSE_SERVICE_URL:http://localhost:8091}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/expenses/**,/api/budgets/**,/api/ai/**

# Gateway Route 3 - Notification Service
spring.cloud.gateway.routes[2].id=notification-service
spring.cloud.gateway.routes[2].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8092}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/notifications/**

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
