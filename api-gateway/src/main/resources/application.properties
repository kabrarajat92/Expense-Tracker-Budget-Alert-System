spring.application.name=api-gateway

# Server Configuration
server.port=${SERVER_PORT:8081}

# Redis Configuration for Rate Limiting
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Gateway Route 1 - User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://localhost:8090}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/v1/auth/**,/api/v1/users/**

# Gateway Route 2 - Expense Service
spring.cloud.gateway.routes[1].id=expense-service
spring.cloud.gateway.routes[1].uri=${EXPENSE_SERVICE_URL:http://localhost:8091}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/expenses/**,/api/ai/**,/api/v1/expenses/**,/api/v1/ai/**

# Gateway Route 3 - Budget Service
spring.cloud.gateway.routes[2].id=budget-service
spring.cloud.gateway.routes[2].uri=${BUDGET_SERVICE_URL:http://localhost:8093}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/budgets/**,/api/budgets/**

# Gateway Route 4 - Notification Service
spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=${NOTIFICATION_SERVICE_URL:http://localhost:8092}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**,/api/v1/notifications/**

# Gateway Route 5 - Analytics Service
spring.cloud.gateway.routes[4].id=analytics-service
spring.cloud.gateway.routes[4].uri=${ANALYTICS_SERVICE_URL:http://localhost:8094}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/analytics/**

# CORS Configuration
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200,http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# Actuator & Observability Metrics Export
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
