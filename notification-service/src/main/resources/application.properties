spring.application.name=notification-service

server.port=${SERVER_PORT:8092}
spring.data.mongodb.uri=${MONGO_URI:mongodb://admin:admin123@localhost:27017/expense_tracker_notification_db?authSource=admin}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.expensetracker.notificationservice.event.BudgetAlertEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false


jwt.secret=${JWT_SECRET:XXXXXXX}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:XXXXXXXXXXXXXXXXX}
spring.mail.password=${MAIL_PASSWORD:XXXXXXX}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true