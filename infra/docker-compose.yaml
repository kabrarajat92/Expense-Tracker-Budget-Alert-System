services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    #ports:
    #  - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  user-service:
    build: ../user-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/expense_tracker_user_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  expense-service:
    build: ../expense-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    ports:
      - "8091:8091"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/expense_tracker_expense_db
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GROQ_API_KEY: ${GROQ_API_KEY}

  notification-service:
    build: ../notification-service
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8092:8092"
    environment:
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/expense_tracker_notification_db?authSource=admin
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

  api-gateway:
    build: ../api-gateway
    depends_on:
      - user-service
      - expense-service
      - notification-service
    ports:
      - "8081:8081"
    environment:
      USER_SERVICE_URL: http://user-service:8090
      EXPENSE_SERVICE_URL: http://expense-service:8091
      NOTIFICATION_SERVICE_URL: http://notification-service:8092
      

  frontend:
    build: ../expense-tracker-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
  mongo_data:
  redis_data: