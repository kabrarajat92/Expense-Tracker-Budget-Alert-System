<div class="auth-shell">
    <div class="auth-visual">
      <div class="visual-content">
        <div class="brand">
          <span class="brand-mark">₹</span>
          <span class="brand-name">Expense Traceker</span>
        </div>
  
        <p class="tagline">Start keeping the record straight.</p>
  
        <div class="ledger-preview">
          <div class="ledger-row">
            <span class="ledger-cat">Track expenses by category</span>
          </div>
          <div class="ledger-row">
            <span class="ledger-cat">Set budgets, get alerted at 80%</span>
          </div>
          <div class="ledger-row">
            <span class="ledger-cat">Ask the AI assistant anything</span>
          </div>
        </div>
      </div>
    </div>
  
    <div class="auth-form-panel">
      <div class="form-wrap">
        <h1>Create your account</h1>
        <p class="subtitle">Takes about thirty seconds.</p>
  
        <form (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" [(ngModel)]="username" name="username" placeholder="Choose a username" autocomplete="username" />
          </div>
  
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" autocomplete="email" />
          </div>
  
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" />
          </div>
  
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
          </div>
  
          <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
          <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
  
          <button type="submit" [disabled]="isLoading">
            {{ isLoading ? 'Creating account...' : 'Create account' }}
          </button>
        </form>
  
        <p class="switch-link">
          Already have an account? <a routerLink="/login">Sign in</a>
        </p>
      </div>
    </div>
  </div>
