<div class="page">
    <div class="page-header">
      <h1>Expenses</h1>
      <p class="page-sub">Log what you spend, as you spend it.</p>
    </div>
  
    <div class="add-panel">
      <form (ngSubmit)="addExpense()">
        <input type="text" [(ngModel)]="newExpense.category" name="category" placeholder="Category" />
        <input type="number" [(ngModel)]="newExpense.amount" name="amount" placeholder="Amount (₹)" />
        <input type="text" [(ngModel)]="newExpense.description" name="description" placeholder="Description" />
        <input type="date" [(ngModel)]="newExpense.expenseDate" name="expenseDate" />
        <button type="submit" [disabled]="saving">{{ saving ? 'Adding...' : 'Add expense' }}</button>
      </form>
    </div>
  
    <table class="ledger" *ngIf="expenses.length > 0">
      <thead>
        <tr>
          <th>Date</th>
          <th>Category</th>
          <th>Description</th>
          <th class="right">Amount</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let e of expenses">
          <td class="mono">{{ e.expenseDate }}</td>
          <td>{{ e.category }}</td>
          <td>{{ e.description }}</td>
          <td class="mono right">₹{{ e.amount | number:'1.0-2' }}</td>
        </tr>
      </tbody>
    </table>
    <p class="empty" *ngIf="expenses.length === 0">No expenses yet. Add your first one above.</p>
  </div>
