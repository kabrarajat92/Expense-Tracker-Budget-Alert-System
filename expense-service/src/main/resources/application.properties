spring.application.name=expense-service

spring.datasource.url:${DB_URL:jdbc:mysql://localhost:3306/expense_tracker_expense_db}
spring.datasource.username:${DB_USERNAME:root}
spring.datasource.password:${DB_PASSWORD:XXXXX}

spring.jpa.hibernate.ddl-auto: update
spring.jpa.show-sql: false

server.port:${SERVER_PORT:8091}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

groq.api.key=${GROQ_API_KEY:XXXXXXXXXXX}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b
#groq.model=llama-3.1-8b-instant

#circuit breaker(resilience4j)
resilience4j.circuitbreaker.instances.groqApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.groqApi.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.groqApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groqApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.groqApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.groqApi.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.groqApi.timeout-duration=10s

#logging level
logging.level.io.github.resilience4j=DEBUG

#Actuator
management.endpoints.web.exposure.include=health,circuitbreakers
management.health.circuitbreakers.enabled=true

# Redis caching
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

jwt.secret=${JWT_SECRET:XXXXXXXX}